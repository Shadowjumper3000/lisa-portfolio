name: portfolio-lisa

services:
  portfolio:
    extends:
      file: docker-compose.yml
      service: portfolio

    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-hello@example.com}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-#}
        VITE_TWITTER_URL: ${VITE_TWITTER_URL:-#}

    # Production refuses to fall back to the development defaults in the base
    # file. A missing secret fails the deploy instead of silently shipping
    # `minioadmin` / `dev-only-insecure-secret` to the internet.
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}

    # Host bind mounts, matching what has actually been deployed since
    # b98d020 (2026-02-19, "improved data persistence"). This is where the live
    # database and gallery objects are — NOT the portfolio-lisa-db-data named
    # volume, which is a stale leftover from before that commit.
    #
    # Override the paths only if the data genuinely lives elsewhere; the deploy
    # workflow refuses to start unless DB_DATA already contains an initialised
    # cluster, so a wrong path aborts the deploy instead of silently initdb'ing
    # an empty one and serving a blank site.
    volumes:
      - ${DB_DATA:-../data/db}:/var/lib/postgresql/data
      - ${MINIO_DATA:-../data/minio}:/var/lib/minio

    # nginx binds 8080, not 80 — an unprivileged process cannot take a port
    # below 1024. The reverse proxy upstream must point at port 8080.
    expose:
      - 8080

    networks:
      default:
      proxy:
        # Keeps the old hostname working so only the port changes upstream.
        aliases:
          - portfolio-lisa-web

    restart: unless-stopped

networks:
  default:
    name: portfolio-lisa-internal
  proxy:
    external: true
    name: proxy
