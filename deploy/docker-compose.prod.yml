name: portfolio-lisa

services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    volumes:
      # Persist Postgres data in the project `data/db` directory (host bind)
      - ../data/db:/var/lib/postgresql/data
      - ../db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - 5432
    restart: unless-stopped

  minio:
    extends:
      file: docker-compose.yml
      service: minio
    expose:
      - 9000
      - 9001
    # Persist MinIO data (object storage) in the project `data/minio` directory
    volumes:
      - ../data/minio:/data
    restart: unless-stopped

  app:
    extends:
      file: docker-compose.yml
      service: app
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: production
    expose:
      - 8080
    restart: unless-stopped

  web:
    extends:
      file: docker-compose.yml
      service: web
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
      target: production
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-hello@example.com}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-#}
        VITE_TWITTER_URL: ${VITE_TWITTER_URL:-#}
    expose:
      - 80
    networks:
      - default
      - proxy
    restart: unless-stopped

# Using host bind mounts for production data directories (see above)
# Named Docker volumes removed to ensure data is stored under project `data/`.

networks:
  default:
    name: portfolio-lisa-internal
  proxy:
    external: true
    name: proxy
