name: portfolio-lisa

services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - 5432
    restart: unless-stopped

  minio:
    extends:
      file: docker-compose.yml
      service: minio
    expose:
      - 9000
      - 9001
    restart: unless-stopped

  app:
    extends:
      file: docker-compose.yml
      service: app
    build:
      context: ../app
      dockerfile: Dockerfile
      target: production
    expose:
      - 8080
    restart: unless-stopped

  web:
    extends:
      file: docker-compose.yml
      service: web
    build:
      context: ../web
      dockerfile: Dockerfile
      target: production
    expose:
      - 80
    environment:
      - VITE_API_BASE=${VITE_API_BASE}
    networks:
      - default
      - proxy
    restart: unless-stopped

volumes:
  db_data:
    name: portfolio-lisa-db-data
  minio_data:
    name: portfolio-lisa-minio-data

networks:
  default:
    name: portfolio-lisa-internal
  proxy:
    external: true
    name: proxy
