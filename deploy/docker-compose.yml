services:
  db:
    image: lisa-gallery-db:${VERSION_DB:-latest}
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:15
    container_name: lisa-gallery-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-portfolio}
    volumes:
      - db_data:/var/lib/postgresql/data
    

  minio:
    image: minio/minio:latest
    container_name: lisa-gallery-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    

  app:
    image: lisa-gallery-app:${VERSION_APP:-latest}
    container_name: lisa-gallery-app
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-portfolio}
      - JWT_SECRET=${JWT_SECRET:-changemeinproduction}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    depends_on:
      - db
      - minio
    

  web:
    image: lisa-gallery-web:${VERSION_WEB:-latest}
    container_name: lisa-gallery-web
    environment:
      - SERVER_NAME=${SERVER_NAME:-_}
    depends_on:
      - app
    

volumes:
  db_data:
    name: lisa-gallery-db-data
  minio_data:
    name: lisa-gallery-minio-data

