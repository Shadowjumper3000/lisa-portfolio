; Production supervision tree: postgres + minio + Go API + nginx.
; supervisord itself runs as uid 999 — there is no root process in this
; container, so every path it writes to lives under a 999-owned directory.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- data tier -------------------------------------------------------------

; listen_addresses is forced to loopback on the command line (which outranks
; postgresql.conf) so the database is unreachable from outside the container
; even though it no longer sits behind a private compose network.
[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1
priority=10
autostart=true
autorestart=true
startsecs=5
; SIGINT is a Postgres *fast* shutdown; the default SIGTERM is a smart shutdown
; that waits for clients to disconnect and would hang container stop.
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /var/lib/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
priority=10
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/minio"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- application tier ------------------------------------------------------

[program:api]
command=/usr/local/bin/start-api.sh /usr/local/bin/portfolio-server
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=5
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
