; Development supervision tree: postgres + minio + `go run` API + Vite.
; Same single container as production, but the web tier is the Vite dev server
; (which proxies /api itself) instead of nginx, and the data services listen on
; all interfaces so the compose port mappings below can reach them.
;
; Those dev ports are still published to host loopback only — see
; docker-compose.dev.yml.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- data tier -------------------------------------------------------------

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /var/lib/minio --address :9000 --console-address :9001
priority=10
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/minio"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- application tier ------------------------------------------------------

[program:api]
command=/usr/local/bin/start-api.sh /usr/local/go/bin/go run .
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=GOPATH="/opt/go",GOCACHE="/opt/go-cache",GOFLAGS="-mod=mod",HOME="/opt/go"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vite]
command=/usr/local/bin/npm run dev
directory=/usr/src/app
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=NPM_CONFIG_CACHE="/opt/npm-cache",HOME="/opt/npm-cache"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
