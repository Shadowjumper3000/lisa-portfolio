name: Deploy to Hetzner

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          debug: true
          script: |
            set -e
            APP_DIR="/home/${{ secrets.HETZNER_USER }}/portfolio-lisa"
            
            echo "🔍 Debug: Starting deployment..."
            echo "📁 App directory: $APP_DIR"
            
            # Create directory if needed
            mkdir -p $APP_DIR && cd $APP_DIR
            echo "✅ Directory created/verified"
            
            # Clone or update repository
            if [ ! -d ".git" ]; then
              echo "📥 Cloning repository..."
              git clone -b prod https://github.com/${{ github.repository }}.git .
            else
              echo "🔄 Updating repository..."
              git fetch origin && git reset --hard origin/prod && git clean -fd
            fi
            echo "✅ Repository updated"
            
            # Create .env file from individual secrets
            echo "📝 Creating .env file..."
            cat > .env << 'EOF'
            # Database Configuration
            DB_HOST=db
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            
            # JWT Secret
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # MinIO Configuration
            MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
            MINIO_ENDPOINT=minio:9000
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ROOT_USER }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_ROOT_PASSWORD }}
            MINIO_USE_SSL=false
            
            # Admin User for Seeding
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            
            # Other Configuration
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            SERVER_NAME=${{ secrets.SERVER_NAME }}
            EOF
            
            # Debug: Check if .env was created and has content
            echo "📋 Checking .env file:"
            ls -lh .env
            echo "📄 .env has $(wc -l < .env) lines"
            
            # Update database init script with admin credentials
            echo "🔐 Updating admin credentials in init script..."
            sed -i "s/VALUES ('admin', 'password')/VALUES ('${{ secrets.ADMIN_USERNAME }}', '${{ secrets.ADMIN_PASSWORD }}')/g" db/init/init.sql
            
            # Deploy with Docker Compose
            echo "🐳 Starting Docker Compose deployment..."
            cd deploy
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Seed admin user in database
            echo "🌱 Seeding admin user..."
            cd $APP_DIR
            docker compose -f deploy/docker-compose.prod.yml exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -f /docker-entrypoint-initdb.d/init.sql || true
            
            # Verify deployment
            echo "🔍 Verifying deployment..."
            cd deploy
            if docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ Deployment successful"
              docker compose -f docker-compose.prod.yml ps
            else
              echo "❌ Deployment failed"
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            
            # Cleanup .env
            echo "🧹 Cleaning up .env file..."
            cd $APP_DIR
            rm -f .env
            
            echo "🎉 Deployment completed successfully!"

