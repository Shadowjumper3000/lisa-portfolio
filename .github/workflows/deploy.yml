name: Deploy to Production

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}
      
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            DEPLOY_DIR="/home/${{ secrets.HETZNER_USER }}/portfolio-lisa"
            
            # Ensure GitHub is in known_hosts
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            
            # Check if directory exists and is a valid git repo
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "Repository exists, updating..."
              cd "$DEPLOY_DIR"
              git fetch origin prod
              git reset --hard origin/prod
            else
              echo "Repository not found, cloning..."
              rm -rf "$DEPLOY_DIR"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git checkout prod
            fi
            
            # Create .env file with secrets
            cat > "$DEPLOY_DIR/.env" << 'ENVEOF'
          DB_HOST=db
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ROOT_USER }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_USE_SSL=false
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
          VITE_INSTAGRAM_URL=${{ vars.VITE_INSTAGRAM_URL }}
          VITE_TWITTER_URL=${{ vars.VITE_TWITTER_URL }}
          SERVER_NAME=${{ secrets.SERVER_NAME }}
          ENVEOF
            
            # Update database init script with admin credentials
            sed -i "s/VALUES ('admin', 'password')/VALUES ('${{ secrets.ADMIN_USERNAME }}', '${{ secrets.ADMIN_PASSWORD }}')/g" "$DEPLOY_DIR/db/init/init.sql"
            
            # Deploy with Docker Compose
            cd "$DEPLOY_DIR/deploy"
            docker compose -p portfolio-lisa -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -p portfolio-lisa -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Wait for services to start
            sleep 15
            
            # Ensure database user exists and seed admin user
            # First, create the user if it doesn't exist (connect as postgres superuser)
            docker compose -p portfolio-lisa -f docker-compose.prod.yml exec -T db psql -U postgres -d postgres -c "CREATE USER ${{ secrets.DB_USER }} WITH PASSWORD '${{ secrets.DB_PASSWORD }}' CREATEDB;" || true
            docker compose -p portfolio-lisa -f docker-compose.prod.yml exec -T db psql -U postgres -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.DB_NAME }} TO ${{ secrets.DB_USER }};" || true
            
            # Now run migrations through the app (migrations will run automatically on app startup)
            echo "✅ Database user ensured, migrations will run on app startup"
            
            # Verify deployment
            if docker compose -p portfolio-lisa -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ Deployment successful"
              docker compose -p portfolio-lisa -f docker-compose.prod.yml ps
            else
              echo "❌ Deployment failed"
              docker compose -p portfolio-lisa -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            
            # Cleanup .env
            rm -f "$DEPLOY_DIR/.env"
            
            echo "🎉 Deployment completed successfully!"
          EOF

