name: Deploy to Hetzner

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy to Hetzner host
        env:
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          set -euo pipefail
          
          SSH_CMD="ssh -o StrictHostKeyChecking=no -p ${HETZNER_PORT} ${HETZNER_USER}@${HETZNER_HOST}"
          
          # Create directory if it doesn't exist
          $SSH_CMD "mkdir -p ~/portfolio-lisa"
          
          # Clone repo if it doesn't exist, otherwise pull changes from prod branch
          $SSH_CMD "cd ~/portfolio-lisa && if [ -d .git ]; then git fetch origin && git checkout prod && git pull origin prod; else git clone -b prod https://github.com/${{ github.repository }}.git .; fi"
          
          # Create .env file with secrets
          $SSH_CMD "cat > ~/portfolio-lisa/.env" <<'EOF'
          # Database Configuration
          DB_HOST=db
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          
          # JWT Secret
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          
          # MinIO Configuration
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ROOT_USER }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_USE_SSL=false
          
          # Admin User for Seeding
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          
          # Other Configuration
          VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          SERVER_NAME=${{ secrets.SERVER_NAME }}
          EOF
          
          # Update init.sql with admin credentials from secrets
          $SSH_CMD "cd ~/portfolio-lisa && sed -i \"s/VALUES ('admin', 'password')/VALUES ('${{ secrets.ADMIN_USERNAME }}', '${{ secrets.ADMIN_PASSWORD }}')/g\" db/init/init.sql"
          
          # Pull latest images and rebuild
          $SSH_CMD "cd ~/portfolio-lisa && docker compose -f deploy/docker-compose.prod.yml pull --ignore-pull-failures || true"
          
          # Bring up the services
          $SSH_CMD "cd ~/portfolio-lisa && docker compose -f deploy/docker-compose.prod.yml up -d --build"
          
          # Wait for database to be ready and re-run init script to ensure admin user is seeded
          $SSH_CMD "cd ~/portfolio-lisa && sleep 10 && docker compose -f deploy/docker-compose.prod.yml exec -T db psql -U \${{ secrets.DB_USER }} -d \${{ secrets.DB_NAME }} -f /docker-entrypoint-initdb.d/init.sql || true"
