name: Test Deployment

on:
  pull_request:
    branches: [prod]

jobs:
  test-build:
    name: Test Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create mock .env file
        run: |
          cat > .env << 'EOF'
          DB_HOST=db
          DB_PORT=5432
          DB_USER=testuser
          DB_PASSWORD=testpass
          DB_NAME=testdb
          JWT_SECRET=test-secret-key-for-ci
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_USE_SSL=false
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=admin123
          VITE_API_BASE=http://localhost:8080
          SERVER_NAME=localhost
          EOF

      - name: Test docker-compose configuration
        run: |
          cd deploy
          docker compose -f docker-compose.prod.yml config

      - name: Build all services
        run: |
          cd deploy
          docker compose -f docker-compose.prod.yml build

      - name: Start services
        run: |
          cd deploy
          docker compose -f docker-compose.prod.yml up -d
          sleep 30

      - name: Check services health
        run: |
          cd deploy
          docker compose -f docker-compose.prod.yml ps
          
          # Check if containers are running
          if ! docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
            echo "❌ Some services failed to start"
            docker compose -f docker-compose.prod.yml logs
            exit 1
          fi
          
          echo "✅ All services started successfully"

      - name: Test connectivity
        run: |
          # Wait for app to be ready
          sleep 10
          
          # Check if app container is accessible
          cd deploy
          docker compose -f docker-compose.prod.yml exec -T app wget -O- http://localhost:8080 || echo "App not responding yet (expected if no health endpoint)"

      - name: Cleanup
        if: always()
        run: |
          cd deploy
          docker compose -f docker-compose.prod.yml down -v
          docker compose -f docker-compose.prod.yml rm -f

      - name: Summary
        if: success()
        run: |
          echo "✅ Deployment test passed!"
          echo "All services built and started successfully."
