# nginx runs unprivileged (uid 999) inside the all-in-one container.
# No `user` directive: the master is already non-root, so it cannot setuid
# workers and would only emit a warning.

pid /var/lib/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Every scratch path must live somewhere uid 999 owns; the Debian defaults
    # under /var/lib/nginx are root-owned in the stock image.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # The Go API is a sibling process on loopback, not a separate container.
    upstream api {
        server 127.0.0.1:8090;
    }

    server {
        # 8080, not 80: an unprivileged process cannot bind a port below 1024.
        # The reverse proxy in front of this container must target 8080.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Allow larger file uploads (500MB)
        client_max_body_size 500M;

        # API proxy to backend (must come before static files)
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Ensure images are proxied, not served as static files
            proxy_buffering off;
        }

        # Health check proxy
        location /health {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Static files with caching (exclude /api/ paths)
        location ~* ^/(?!api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback - serve index.html for all non-file requests
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
