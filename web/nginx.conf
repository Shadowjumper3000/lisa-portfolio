server {
  listen 80;
  # server_name is substituted at container start from $SERVER_NAME (or '_' fallback)
  server_name ${SERVER_NAME};

  root /usr/share/nginx/html;
  index index.html;

  # Allow larger file uploads (500MB)
  client_max_body_size 500M;

  # Serve API by proxying to the app service
  location /api/ {
    proxy_pass http://app:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health/management endpoint proxy to backend
  location /health {
    proxy_pass http://app:8080/health;
  }

  # SPA fallback: serve index.html for all non-file routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: basic caching for static assets
  location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
